update: |
  ここではプレイヤーのキャラクタの設定を更新します。
  現在のキャラクタの設定は次のJSONの形式で作成してあります。

  {
    "name": "名前",
    "race": "種族",
    "job": "職業",
    "description": "特徴の説明",
    "area-code": "住んでいる地域の地域コード",
    "area-name": "住んでいる地域の名前",
    "error": ""
  }

  キャラクタの設定はこの後 JSON: の後に示します。

  さらに追加でプレイヤーは140字以内の短い文でキャラクタにどんな変化があるかを申請します。
  あなたはその内容を調べて適切に解釈し、キャラクタの設定を更新してください。

  プレイヤーからの新たな入力はこの後 Input: の後に示します。
  あなたは総合的に見直した設定を次の形式のJSONで出力してください。

  {
    "name": "名前",
    "race": "種族",
    "job": "職業",
    "description": "特徴の説明",
    "area-code": "住んでいる地域の地域コード",
    "area-name": "住んでいる地域の名前",
    "error": "エラー"
  }

  名前(name)、種族(race)、職業(job)は中世ファンタジーに相応しいものだけ採用してください。
  名前(name)はできるだけカタカナで表記してください。
  種族(race)と職業(job)はできるだけ漢字で表記してください。

  特徴の説明(description)ではプレイヤーの没入感を妨げるような、却下内容やメタな表現は入れないでください。
  入力された設定を中心に、情景や日常の様子を描写して文章を豊かにしてください。
  ただし、新しい経験・能力・人間関係・重要な事実を必要以上に追加しないでください。

  住んでいる地域の地域コード(area-code)は前述の地域リストのコード(code)を使ってください。
  住んでいる地域の名前(area-name)は前述の地域リストの名前(name)を参考に自然に表現してください。

  エラー(error)には、どうしても解釈できなかった場合にその理由を書いてください。
  正常に解釈された場合はエラー(error)は空文字列 "" にしてください。

  前回の設定と今回更新される設定との間の差異は、キャラクタの特徴や性格に照らして適切な範囲に収めてください。
  また、前回の設定と今回更新される設定との間で経過した時間は12日間程度と考え、それを超えるほどの期間が必要な変化が要求された場合は、12日間程度で可能な変化に抑えて解釈し直してください。

update-image: |
  ここではプレイヤーのキャラクタの画像を更新します。
  更新前の画像を参照して、同一人物の範囲で更新してください。
  キャラクタの設定はすでに次のJSONの形式で更新されてあります。

  {
    "name": "名前",
    "race": "種族",
    "job": "職業",
    "description": "特徴の説明",
    "area-code": "住んでいる地域の地域コード",
    "area-name": "住んでいる地域の名前",
    "error": ""
  }

  あなたはその内容を調べて適切に解釈し、この設定の更新に合うように、キャラクタの画像を更新してください。

  入力はこの後 Input: の後に示します。

action: |
  ここではプレイヤーのキャラクタの1日の行動を文章にまとめます。
  プレイヤーは140字以内の短い文でその日のキャラクタの行動を申請します。
  あなたはその内容を調べて適切に解釈し、キャラクタの行動記録を作成してください。
  その際、キャラクタの設定を考慮した上で、無理の無い行動に丸めてください。

  キャラクタの設定は次のJSONの形式で決まっています。

  {
    "name": "名前",
    "race": "種族",
    "job": "職業",
    "description": "特徴の説明",
    "area-code": "住んでいる地域の地域コード",
    "area-name": "住んでいる地域の名前",
    "error": ""
  }

  入力はこの後 Input: の後に示します。
  出力は本文だけとし、見出しやマークアップは省いてください。

action-image: |
  ここではプレイヤーのキャラクタの行動を画像に描きます。
  元の画像は人物の特徴の参考のために使うだけであり、新たに描く画像の場面や動作は文章に従ってください。

  プレイヤーの行動の文章はこの後 Text: の後に示します。
